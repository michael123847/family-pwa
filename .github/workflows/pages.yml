name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Guard against private network identifiers (this repo is public)
        run: |
          rc=0
          git grep -nIP '\btail[0-9a-f]{6,}\b|[a-z0-9-]+\.ts\.net\b|\b(192\.168|10\.\d{1,3}|172\.(1[6-9]|2\d|3[01])|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b(?!/)' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::private IP or tailnet name committed to this public repo"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::leak guard could not run (git grep exit $rc)"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the contents of public/ are deployed. Repo root holds
          # README, LICENSE, archive/, .github/, etc. — none of which should
          # be served to browsers.
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
